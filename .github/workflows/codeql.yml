name: CodeQL

# Source-level security analysis (javascript-typescript needs no build step).
# Config in .github/codeql-config.yml: security-extended queries, bundle and
# content trees excluded. Findings land under Security → Code scanning.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 8 * * 1' # Mondays 08:30 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
